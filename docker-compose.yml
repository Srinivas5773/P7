version: '3.8'

services:
  omnihealth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnihealth-hospital-os
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
